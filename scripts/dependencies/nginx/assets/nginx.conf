# Run worker processes as www-data so they can read /etc/nginx/.htpasswd
# (which is `root:www-data 640` — readable only to root or the www-data
# group). Without this, nginx falls back to a compiled-in default user
# (`nobody` on this Debian build) and basic-auth fails with HTTP 500 +
# "open() /etc/nginx/.htpasswd failed (13: Permission denied)" in
# /var/log/nginx/error.log.
user www-data;

events {}

http {
    server {
        listen 8080 default_server;
        server_name _;

        root /opt/baroboys/static;
        index admin.html;

        auth_basic "Admin Interface";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Exact matches for core static files
        location = /admin.html { try_files /admin.html =404; }
        location = /favicon.ico { try_files /favicon.ico =404; }
        location = /robots.txt { try_files /robots.txt =404; }
        location = /status.json { try_files /status.json =404; }

        # Serve custom static 404 page
        error_page 404 /404.html;
        location = /404.html {
            try_files /404.html =404;
        }

        # Proxy API requests, stripping `/api/`
        location /api/ {
            proxy_pass http://127.0.0.1:5000/;
            proxy_set_header Host $host;
        }

        error_log /var/log/nginx/error.log;
        access_log /var/log/nginx/access.log;
    }
}
